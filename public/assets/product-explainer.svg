<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2400" viewBox="0 0 1440 2400" role="img" aria-labelledby="title desc">
  <title id="title">你想活出怎样的人生：AI 人生模拟器产品讲解图</title>
  <desc id="desc">从选择人生世界开始，AI 编织人物与事件，玩家在关键节点作出选择，逐年推进至人生终章并分享。</desc>
  <defs>
    <linearGradient id="bg" x2="0.9" y2="1"><stop stop-color="#081a31"/><stop offset=".54" stop-color="#102943"/><stop offset="1" stop-color="#142f3a"/></linearGradient>
    <linearGradient id="hero" x2="1" y2="1"><stop stop-color="#1c4860"/><stop offset=".55" stop-color="#183f55"/><stop offset="1" stop-color="#234c4c"/></linearGradient>
    <linearGradient id="gold" x2="1"><stop stop-color="#e8bd73"/><stop offset="1" stop-color="#f3dba5"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d9e6dd" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#f5f3eb} .muted{fill:#abc1ca} .gold{fill:#f2d69a} .jade{fill:#a7d8c4} .tiny{font-size:18px;letter-spacing:2px}.body{font-size:23px}.label{font-size:20px;letter-spacing:1px}.h2{font-size:32px;font-weight:700}.card{fill:#10273d;stroke:#496578;stroke-width:1.5}.line{stroke:#83b8ac;stroke-width:2;fill:none}.dashed{stroke-dasharray:7 10}.paper text{fill:#132c3e}.paper .gold{fill:#8a6930}.paper .jade{fill:#39675a}.paper .muted{fill:#526975}
    </style>
  </defs>
  <rect width="1440" height="2400" fill="url(#bg)"/><rect width="1440" height="2400" fill="url(#grid)"/>
  <g opacity=".75" fill="#f2d69a"><circle cx="115" cy="95" r="2"/><circle cx="1300" cy="120" r="3"/><circle cx="1230" cy="320" r="2"/><circle cx="182" cy="438" r="2"/><circle cx="1300" cy="970" r="2"/><circle cx="168" cy="1580" r="3"/><circle cx="1290" cy="1770" r="2"/><circle cx="1160" cy="2190" r="3"/></g>
  <g opacity=".12" fill="none" stroke="#a7d8c4"><circle cx="1235" cy="274" r="195"/><circle cx="1235" cy="274" r="142"/><circle cx="1235" cy="274" r="89"/><path d="M1038 274h394M1235 77v394"/></g>
  <text x="112" y="110" class="tiny jade">AI 人生模拟器 · 产品说明</text>
  <text x="108" y="205" font-size="76" font-weight="700">把“如果那样活过”</text><text x="108" y="296" font-size="76" font-weight="700" class="gold">变成一段可选择的人生</text>
  <text x="112" y="356" class="body muted">从一片星图出发，亲手写下世界、相遇、转弯与终章。</text>
  <g transform="translate(108 405)"><rect width="1224" height="245" rx="26" fill="url(#hero)" stroke="#71988e" stroke-opacity=".7"/>
    <text x="38" y="55" class="tiny gold">一局人生的核心循环</text>
    <g transform="translate(35 88)">
      <g><circle cx="48" cy="55" r="34" fill="#e2bd76" fill-opacity=".17" stroke="#e2bd76"/><text x="37" y="64" font-size="28" class="gold">01</text><text x="98" y="49" font-size="25" font-weight="700">设定此生</text><text x="98" y="81" class="label muted">世界 · 时代 · 身份 · 志向</text></g>
      <path d="M365 55h35" class="line"/><path d="m390 45 14 10-14 10" class="line"/>
      <g transform="translate(405)"><circle cx="48" cy="55" r="34" fill="#a7d8c4" fill-opacity=".14" stroke="#a7d8c4"/><text x="37" y="64" font-size="28" class="jade">02</text><text x="98" y="49" font-size="25" font-weight="700">AI 编织</text><text x="98" y="81" class="label muted">人物 · 关系 · 事件 · 回忆</text></g>
      <path d="M770 55h35" class="line"/><path d="m795 45 14 10-14 10" class="line"/>
      <g transform="translate(810)"><circle cx="48" cy="55" r="34" fill="#d2a6b2" fill-opacity=".16" stroke="#d2a6b2"/><text x="37" y="64" font-size="28" fill="#f1c9d2">03</text><text x="98" y="49" font-size="25" font-weight="700">亲自经历</text><text x="98" y="81" class="label muted">逐年推进 · 做出选择</text></g>
    </g>
  </g>
  <text x="112" y="725" class="tiny jade">01 / 从星图选择你的起点</text><text x="112" y="778" class="h2">先定“我从哪里出发”，再定“我想成为谁”</text>
  <g transform="translate(108 812)">
    <rect class="card" width="582" height="250" rx="22"/><text x="32" y="46" class="label gold">四项开局设定</text>
    <g class="body"><text x="34" y="100" class="jade">世界</text><text x="152" y="100">现实 / 奇幻 / 自定义作品世界</text><text x="34" y="145" class="jade">时代</text><text x="152" y="145">年代与社会背景</text><text x="34" y="190" class="jade">身份</text><text x="152" y="190">你以什么身份来到这里</text><text x="34" y="235" class="jade">志向</text><text x="152" y="235">你想走向怎样的生活</text></g>
    <rect x="615" width="609" height="250" rx="22" class="card"/><text x="650" y="46" class="label gold">让故事更像“你的”</text>
    <text x="650" y="100" class="body">✦ 自定义世界描述与时代背景</text><text x="650" y="145" class="body">✦ 随机选择也会落成明确的人生设定</text><text x="650" y="190" class="body">✦ 可选姓名、性格与想遇见的人物</text><text x="650" y="235" class="body">✦ 开局后直接进入人生第 1 年</text>
  </g>
  <g transform="translate(108 1096)"><rect width="1224" height="185" rx="22" fill="#122c3e" stroke="#38576b"/><text x="34" y="48" class="label gold">不是填完表就看结局</text><text x="34" y="103" font-size="29" font-weight="700">你会一路遇见人、积累关系、改变属性，并在重要节点决定下一步。</text><text x="34" y="148" class="body muted">每一次选择都会进入人生记录；故事接着往前走，影响也留在关系与终章里。</text></g>
  <text x="112" y="1360" class="tiny jade">02 / 在时间里生活，而不是一次读完</text><text x="112" y="1414" class="h2">一条连续时间线，五次重要转弯</text>
  <g transform="translate(108 1450)"><path d="M70 50v286" class="line"/><circle cx="70" cy="55" r="13" fill="#f1d39a" filter="url(#glow)"/><circle cx="70" cy="126" r="8" fill="#a7d8c4"/><circle cx="70" cy="197" r="8" fill="#a7d8c4"/><circle cx="70" cy="268" r="8" fill="#a7d8c4"/><circle cx="70" cy="339" r="13" fill="#f1d39a" filter="url(#glow)"/>
    <text x="112" y="61" font-size="24" class="gold" font-weight="700">第 1 年 · 人生开卷</text><text x="112" y="91" class="label muted">专属封面与开篇记忆，故事正式开始。</text>
    <text x="112" y="132" font-size="24" class="jade" font-weight="700">成长年份 · 记忆逐页打印</text><text x="112" y="162" class="label muted">自动推进可暂停、调速；也可手动走一年或直达下个事件。</text>
    <text x="112" y="203" font-size="24" class="gold" font-weight="700">第 9 / 19 / 31 / 51 / 76 年 · 关键抉择</text><text x="112" y="233" class="label muted">事件到来时暂停，选项改变属性、关系与后续人生。</text>
    <text x="112" y="274" font-size="24" class="jade" font-weight="700">关系谱与人生片段 · 持续累积</text><text x="112" y="304" class="label muted">重要角色在相应阶段登场，共同经历会影响彼此的关系。</text>
    <text x="112" y="345" font-size="24" class="gold" font-weight="700">第 100 年 · 人生终章</text><text x="112" y="375" class="label muted">回望关键节点、重要的人与走到最后的答案，复制或分享。</text>
  </g>
  <g transform="translate(108 1900)"><rect width="1224" height="270" rx="24" fill="#e8e1cf"/><g class="paper"><text x="38" y="54" class="gold" font-size="21" letter-spacing="2">03 / 生成机制与体验控制</text>
    <text x="38" y="108" font-size="26" font-weight="700">每局专属</text><text x="38" y="148" font-size="20">按你的世界与设定，生成</text><text x="38" y="178" font-size="20">摘要、人物、关系、事件和记忆。</text><text x="38" y="217" class="muted" font-size="18">封面为本局生成；关键插画按需绘制。</text>
    <text x="445" y="108" font-size="26" font-weight="700">选择有回声</text><text x="445" y="148" font-size="20">关键节点停下来等你，选择结果</text><text x="445" y="178" font-size="20">写回属性、人物关系与人生轨迹。</text><text x="445" y="217" font-size="18" fill="#526975">自动 0.5× / 1× / 2×，随时暂停。</text>
    <text x="850" y="108" font-size="26" font-weight="700">失败有边界</text><text x="850" y="148" font-size="20">文字模型按顺序尝试，最多 5 个；</text><text x="850" y="178" font-size="20">全部失败就明确提示，不伪造故事。</text><text x="850" y="217" class="muted" font-size="18">插画失败不阻断人生继续。</text></g>
  </g>
  <text x="112" y="2240" class="tiny gold">在同一条人生时间线上，看见另一种可能。</text><text x="112" y="2290" class="body muted">《你想活出怎样的人生》 · 可玩的 AI 人生模拟器</text>
  <g transform="translate(112 2320)"><path d="M0 0h1216" stroke="#69878c" stroke-width="1"/><text x="0" y="38" class="tiny muted">选择起点 → 遇见命运 → 留下回忆 → 写完此生</text><text x="1216" y="38" text-anchor="end" class="tiny jade">每一局，都由你的选择定义</text></g>
</svg>
